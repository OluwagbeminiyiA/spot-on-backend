exclude: |
  (?x)^(
      .*\{\{.*\}\}.*|     # Exclude any files with cookiecutter variables
      docs/site/.*|       # Exclude mkdocs compiled files
      \.history/.*|       # Exclude history files
      .*cache.*/.*|       # Exclude cache directories
      .*venv.*/.*|        # Exclude virtual environment directories
  )$
fail_fast: true
default_language_version:
  python: python3.12
default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
    -   id: no-commit-to-branch
        name: "🌳 git · Protect main branches"
        args: [ "--branch", "main", "--branch", "master" ]


-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
    -   id: ruff-check
        args: [ --fix ]
      # Run the formatter.
    -   id: ruff-format

-   repo: https://github.com/mrtazz/checkmake.git
    rev: v0.3.0
    hooks:
    - id: checkmake


-   repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks


-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.2
    hooks:
      - id: mypy
        args: [ "--config-file=mypy.ini", --ignore-missing-imports, --show-traceback ]
        additional_dependencies:
          - types-requests
          - django-stubs
          - python-decouple
          - djangorestframework
          - django-cors-headers
          - django-autoslug
          - djangorestframework-stubs
        exclude: ^tests/|/tests/|test_.*\.py|tests.py|manage.py


-   repo: local
    hooks:
      - id: django-check
        name: Django system check
        entry: poetry run python -m core_spoton.manage check
        language: system
        pass_filenames: false

#-   repo: https://github.com/pycqa/isort
#    rev: 5.13.2
#    hooks:
#    -   id: isort
#        name: isort (python)


-   repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
    - id: flake8
      additional_dependencies: [flake8-bugbear]
      exclude: ^tests/eval_files/.*|^migrations/.*|/migrations/|tests.py
      args: ["--select=B"]

-   repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
