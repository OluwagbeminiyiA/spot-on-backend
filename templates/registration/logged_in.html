{% extends "base.html" %}

{% block title %}Login Successful - SpotOn{% endblock %}

{% block content %}
<div class="p-8 text-center">
    <div class="mb-6">
        <i class="fas fa-check-circle text-green-500 text-6xl mb-4"></i>
        <h2 class="text-2xl font-bold text-gray-800 mb-2">Login Successful!</h2>
        <p class="text-gray-600">Welcome back, <strong>{{ user.username }}</strong></p>
    </div>

    <div class="space-y-4">
        <p class="text-gray-600">Redirecting you back to the app...</p>
        <a href="http://localhost:5500" class="inline-block bg-gradient-to-r from-primary to-secondary text-white px-8 py-3 rounded-xl font-semibold hover:shadow-lg transition-all">
            <i class="fas fa-arrow-right mr-2"></i>Continue to App
        </a>
    </div>
</div>

<script>
    // Auto-redirect after 2 seconds
    setTimeout(() => {
        window.location.href = 'http://localhost:5500';
    }, 2000);
</script>
{% endblock %}
