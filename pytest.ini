[pytest]
DJANGO_SETTINGS_MODULE = core_spoton.spoton_backend.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Tests*
python_functions = test_*
pythonpath = .
addopts =
    --verbose
    --strict-markers
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --reuse-db
markers =
    slow: mark tests as slow
    integration: mark tests as integration
    unit: mark tests as unit tests
testpaths = tests
