[project]
name = "spoton"
version = "0.1.0"
description = "The backend system for SpotOn, a campus utility service designed to help University of Lagos (UNILAG) students find study spots, hangout locations, and check real-time availability of lecture halls. This project relies on user-generated content (reviews and status reports) to provide up-to-date information."
authors = [
    {name = "Oluwagbeminiyi Agbedejobi",email = "gagbedejobi@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "django (>=5.2.8,<7.0.0)",
    "djangorestframework (>=3.16.1,<4.0.0)",
    "django-cors-headers (==4.9.0)",
    "djangorestframework-simplejwt (==5.5.1)",
    "python-decouple (==3.8)",
    "django-autoslug (>=1.9.9,<2.0.0)",
    "django-split-settings (>=1.3.2,<2.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "django-stubs (>=6.0.3,<7.0.0)",
    "djangorestframework-stubs (>=3.16.9,<4.0.0)"
]

[dependency-groups]
dev = [
    "django (==5.2.8)",
    "django-cors-headers (==4.9.0)",
    "djangorestframework (==3.16.1)",
    "djangorestframework-simplejwt (==5.5.1)",
    "python-decouple (==3.8)",
    "flake8 (>=7.3.0,<8.0.0)",
    "ruff (>=0.15.12,<0.16.0)",
    "pre-commit (>=4.6.0,<5.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.ruff]
target-version = "py312"
line-length = 119
fix = true
indent-width = 4


exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pycache__",
    "*/migrations/*",
    "staticfiles",
    "media",
    "*/tests/*",
    "tests.py",
    "settings.py",
    "local_settings.py",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "DJ",     # flake8-django
    "SIM",    # flake8-simplify
    "PIE",    # flake8-pie
    "T20",    # flake8-print (warns about print statements)
    "RUF",    # Ruff-specific rules
    "PT",     # flake8-pytest-style (if using pytest)
]

ignore = [
    "E501",   # Line too long (handled by formatter)
    "B008",   # Function calls in argument defaults (Django uses this)
    "DJ001",  # Avoid nullable CharField (sometimes necessary)
    "RUF012", # Mutable class attributes (Django models use this)
]

# Allow unused variables when prefixed with underscore
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports OK in __init__.py
"**/tests/**" = ["S101"]  # Allow assert in tests
"settings.py" = ["F405"]  # Allow star imports in settings
"local_settings.py" = ["F405"]  # Allow star imports in settings
"settings/*.py" = ["F405"]  # For split settings

[tool.ruff.lint.isort]
known-first-party = ["core_spoton"]  # Replace with your project name
section-order = [
    "future",
    "standard-library",
    "django",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
"django" = ["django"]

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

# Indent with spaces
indent-style = "space"

# Like Black, respect magic trailing commas
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending
line-ending = "auto"

[tool.ruff.lint.mccabe]
# Flag errors (`C901`) whenever the complexity level exceeds 5.
max-complexity = 12
